[package]
name = "linux-whisper-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "linux-whisper"
path = "src/main.rs"

[features]
default = []
# NVIDIA GPU acceleration for speech recognition. Needs the CUDA toolkit
# (nvcc, cudart, cuBLAS) at build time.
cuda = ["linux-whisper-whisper/cuda"]
# Also run the optional AI formatter on the GPU. Needs NVRTC and cuRAND too.
llm-cuda = ["linux-whisper-llm/gpu"]

[dependencies]
linux-whisper-core = { workspace = true }
linux-whisper-audio = { workspace = true }
linux-whisper-whisper = { workspace = true }
linux-whisper-platform = { workspace = true }
linux-whisper-i18n = { workspace = true }
linux-whisper-llm = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }

[dev-dependencies]
mockall = { workspace = true }
